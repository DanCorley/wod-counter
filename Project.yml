name: WODCounter

options:
  bundleIdPrefix: com.dcorley
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  WODCounter:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WODCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dcorley.WODCounter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WODCounter
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  WODCounterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WODCounterTests
    dependencies:
      - target: WODCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dcorley.WODCounterTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WODCounter.app/WODCounter"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  WODCounter:
    build:
      targets:
        WODCounter: all
        WODCounterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WODCounterTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
