# XcodeGen project definition.
#
# wod-counter.xcodeproj is deliberately NOT tracked in git — project.pbxproj is a
# UUID-keyed plist that conflicts badly and mixes real configuration with churn.
# This file is the tracked source of truth instead; regenerate with:
#
#     xcodegen generate
#
# DEVELOPMENT_TEAM is intentionally absent: it is per-developer state. Xcode's
# automatic signing fills it in locally, and simulator builds need no team at
# all. Set it in a gitignored xcconfig if you need device builds.

name: wod-counter

options:
  bundleIdPrefix: dev.dcorley
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic

    # Carried over from the Xcode-generated project. These are not cosmetic:
    # the codebase relies on default-MainActor isolation (for example
    # SeedMigration.applySeed touches ModelContainer.mainContext from a plain
    # static func). Dropping SWIFT_DEFAULT_ACTOR_ISOLATION changes the
    # concurrency model of every file and the project stops compiling.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: true
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: true

targets:
  WODCounter:
    type: application
    platform: iOS
    sources:
      - WODCounter
    settings:
      base:
        PRODUCT_NAME: WODCounter
        PRODUCT_BUNDLE_IDENTIFIER: dev.dcorley.wodcounter
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight

  WODCounterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WODCounterTests
    dependencies:
      - target: WODCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dcorley.wodcounter.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  WODCounter:
    build:
      targets:
        WODCounter: all
        WODCounterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WODCounterTests
    archive:
      config: Release
